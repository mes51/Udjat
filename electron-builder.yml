appId: dev.mesgo.udjat
productName: Udjat
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # ffprobe-static は全 OS 分のバイナリを含むので、対象プラットフォーム以外を除外する
  - '!node_modules/ffprobe-static/bin/darwin/**'
  - '!node_modules/ffprobe-static/bin/linux/**'
  - '!node_modules/ffprobe-static/bin/win32/ia32/**'
# ネイティブ依存は使わない(DB は node:sqlite)。ffmpeg / ffprobe の実行ファイルは asar の外に出す。
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/@napi-rs/**
npmRebuild: false
# Chromium のロケールは日本語と英語のみ同梱する(サイズ削減)
electronLanguages:
  - ja
  - en-US
win:
  # build/icon.ico は scripts/make-icons.mjs が resources/icon.svg から生成する
  icon: build/icon.ico
  target:
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
# zip 配布はポータブル運用が前提なので、exe の隣に portable.marker を置いて
# 起動時にデータディレクトリを exe 隣の data/ に向ける(src/main/data-dir.ts 参照)。
extraFiles:
  - from: resources/portable.marker
    to: portable.marker
